services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: zip_local_root
      MYSQL_DATABASE: zip_game
      MYSQL_USER: zip_user
      MYSQL_PASSWORD: zip_local_password
    ports:
      - '127.0.0.1:3307:3306'
    volumes:
      - zip_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-pzip_local_root']
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  zip_mysql_data:
